<!DOCTYPE html>
<html>
<head>
<title>Math Notes</title>
<meta charset="UTF-8">
<link rel="icon" href="data:,">

<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/foldgutter.css">
<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/markdown.js"></script>
<script src="/vendor/codemirror/foldcode.js"></script>
<script src="/vendor/codemirror/foldgutter.js"></script>
<script src="/vendor/codemirror/markdown-fold.js"></script>

<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/main.js"></script>
</head>

<body>

<div id="toolbar">
    <button class="toggle active" id="notes-button">Notes</button>
    <button class="toggle" id="python-button">Python</button>
    <button class="toggle" id="settings-button">Settings</button>

    <div id="selectors">
        <label for="subject-select">Selected subject:</label>
        <select id="subject-select"></select>
    </div>
</div>

<div id="app">

    <div id="notes-view">
        <div id="editor-panel">
            <div id="editor-header">
                <select id="note-select" title="Note"></select>
            </div>
            <textarea id="editor"></textarea>
        </div>

        <div id="quarto-panel">
            <iframe id="quarto-frame"></iframe>
        </div>
    </div>

    <div id="python-view">
        <div id="python-message"></div>
        <iframe id="jupyter-frame"></iframe>
    </div>

    <div id="settings-view">
        <h2>Data folder</h2>
        <div class="path" id="settings-data-folder"></div>
        <div class="hint">The folder that holds one folder per subject.</div>
        <button class="open-folder" data-folder="data">Open in Finder</button>

        <h2 style="margin-top:30px">OpenAI key</h2>
        <div id="settings-key"></div>
        <div class="hint" id="settings-key-hint"></div>

        <h2 style="margin-top:30px">App data</h2>
        <div class="path" id="settings-app-data"></div>
        <div class="hint">Settings and the key stay on this computer and are not part of the code.</div>
        <button class="open-folder" data-folder="app_data">Open in Finder</button>
    </div>

</div>

<div id="ai-prompt">
    <textarea id="ai-request" rows="4"></textarea>

    <div id="reference-fields">
        <div class="reference-row">
            <label for="reference-heading">heading:</label>
            <input id="reference-heading" type="text" autocomplete="off">
        </div>

        <div class="reference-row">
            <label for="reference-tag">tag:</label>
            <div class="tag-input">
                <span>#</span>
                <input id="reference-tag" type="text" autocomplete="off">
            </div>
        </div>
    </div>
</div>

<div id="image-picker">
    <input id="image-search" type="text" placeholder="Search images..." autocomplete="off">
    <div id="image-list"></div>
</div>

</body>
</html>
