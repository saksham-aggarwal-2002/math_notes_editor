<script>

let editor;
let saveTimer=null;
let lastQuartoModified=null;


/* --------------------------------------------------
   Initial Quarto preview
-------------------------------------------------- */

document.getElementById("quarto-frame").src=
    "/notes/linalg_1.html?t="+Date.now();


/* --------------------------------------------------
   Custom Quarto folding
-------------------------------------------------- */

CodeMirror.registerHelper("fold","quarto",function(cm,start){

    const line=start.line;
    const text=cm.getLine(line);


    /*
       Quarto ::: blocks

       Example:

       ::: {.box .definition}

       content

       :::
    */

    if(/^\s*:::\s*/.test(text)){

        for(let i=line+1;i<cm.lineCount();i++){

            if(/^\s*:::\s*$/.test(cm.getLine(i))){

                return {
                    from:CodeMirror.Pos(line,text.length),
                    to:CodeMirror.Pos(
                        i,
                        cm.getLine(i).length
                    )
                };

            }

        }

        return;
    }


    /*
       Markdown headings

       # Heading
       ## Heading
       ### Heading

       A heading folds everything until the
       next heading of the same or higher level.
    */

    if(/^\s*#{1,6}\s+/.test(text)){

        const match=text.match(/^\s*(#{1,6})\s+/);
        const headingLevel=match[1].length;


        for(let i=line+1;i<cm.lineCount();i++){

            const nextLine=cm.getLine(i);

            const nextMatch=
                nextLine.match(/^\s*(#{1,6})\s+/);


            if(
                nextMatch &&
                nextMatch[1].length<=headingLevel
            ){

                return {
                    from:CodeMirror.Pos(line,text.length),
                    to:CodeMirror.Pos(
                        i-1,
                        cm.getLine(i-1).length
                    )
                };

            }

        }


        /*
           If this is the final heading,
           fold through the end of the document.
        */

        return {
            from:CodeMirror.Pos(line,text.length),
            to:CodeMirror.Pos(
                cm.lineCount()-1,
                cm.getLine(cm.lineCount()-1).length
            )
        };

    }

});


/* --------------------------------------------------
   Load notebook
-------------------------------------------------- */

async function loadNotebook(){

    const response=await fetch("/notebook");
    const data=await response.json();


    editor=CodeMirror.fromTextArea(
        document.getElementById("editor"),
        {

            mode:"markdown",

            lineNumbers:true,

            lineWrapping:true,


            /*
               Use our custom folding function.

               This handles BOTH:

               Markdown headings
               Quarto ::: blocks
            */

            foldGutter:{
                rangeFinder:function(cm,start){

                    return CodeMirror.fold.quarto(
                        cm,
                        start
                    );

                }
            },


            gutters:[
                "CodeMirror-linenumbers",
                "CodeMirror-foldgutter"
            ]

        }
    );


    editor.setValue(data.content);
    // Collapse all top-level (#) sections
    for(let i=0; i<editor.lineCount(); i++){
        if(/^#\s+/.test(editor.getLine(i))){
        editor.foldCode(CodeMirror.Pos(i, 0));
        }
    }
    editor.on("change",saveNotebook);

}


/* --------------------------------------------------
   Save notebook
-------------------------------------------------- */

function saveNotebook(){

    clearTimeout(saveTimer);


    saveTimer=setTimeout(async()=>{

        await fetch("/notebook",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                content:editor.getValue()
            })

        });

    },500);

}


loadNotebook();


/* --------------------------------------------------
   AI shortcut
-------------------------------------------------- */

document.addEventListener("keydown",event=>{
    if(event.metaKey&&event.shiftKey&&event.key.toLowerCase()==="l"){
        event.preventDefault();
        openAIPrompt();
    }

    if(event.metaKey&&event.shiftKey&&event.key.toLowerCase()==="p"){
        event.preventDefault();
        insertPlaceholder();
    }
});

function insertPlaceholder(){

    const placeholder=`::: {.box}

[content describing the placeholder]{style="color: red;"}.

:::` + "\n";

    const cursor=editor.getCursor();

    editor.replaceRange(
        placeholder,
        cursor
    );

    editor.setCursor({
        line:cursor.line+2,
        ch:1
    });

    editor.focus();
}

/* --------------------------------------------------
   AI prompt
-------------------------------------------------- */

function openAIPrompt(){

    const prompt=
        document.getElementById("ai-prompt");

    prompt.style.display="block";


    const input=
        document.getElementById("ai-request");

    input.value="";

    input.focus();

}


function closeAIPrompt(){

    document.getElementById(
        "ai-prompt"
    ).style.display="none";

}


document.getElementById("ai-request")
.addEventListener("keydown",event=>{

    if(
        event.key==="Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        generateAtCursor();

    }


    if(event.key==="Escape"){

        closeAIPrompt();

    }

});


/* --------------------------------------------------
   AI generation
-------------------------------------------------- */

async function generateAtCursor(){

    const request=
        document.getElementById("ai-request")
        .value.trim();


    if(!request)return;


    const marker="<!-- AI_GENERATING -->";

    const cursor=editor.getCursor();


    editor.replaceRange(
        marker,
        cursor
    );


    closeAIPrompt();

    editor.focus();


    try{

        const response=await fetch(
            "/ai/generate",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:request
                })

            }
        );


        if(!response.ok){

            throw new Error(
                "AI request failed."
            );

        }


        const data=await response.json();


        const text=editor.getValue();

        const markerIndex=
            text.indexOf(marker);


        if(markerIndex===-1){

            alert(
                "Could not find the AI insertion point."
            );

            return;

        }


        const from=
            editor.posFromIndex(markerIndex);


        const to=
            editor.posFromIndex(
                markerIndex+marker.length
            );


        editor.replaceRange(
            data.content,
            from,
            to
        );


    }catch(error){

        alert("AI generation failed.");

    }

}


/* --------------------------------------------------
   Quarto preview refresh
-------------------------------------------------- */

async function checkQuarto(){

    try{

        const response=
            await fetch("/quarto-version");

        const data=
            await response.json();


        if(lastQuartoModified===null){

            lastQuartoModified=
                data.modified;

            return;

        }


        if(
            data.modified !==
            lastQuartoModified
        ){

            lastQuartoModified=
                data.modified;


            const frame=
                document.getElementById(
                    "quarto-frame"
                );


            let scrollX=0;
            let scrollY=0;


            try{

                scrollX=
                    frame.contentWindow.scrollX;

                scrollY=
                    frame.contentWindow.scrollY;

            }catch(error){

                console.log(
                    "Could not read preview scroll position."
                );

            }


            frame.src=
                "/notes/linalg_1.html?t="+Date.now();


            frame.onload=()=>{

                try{

                    frame.contentWindow.scrollTo(
                        scrollX,
                        scrollY
                    );

                }catch(error){

                    console.log(
                        "Could not restore preview scroll position."
                    );

                }

            };

        }


    }catch(error){

        console.log(
            "Could not check Quarto status."
        );

    }

}


setInterval(
    checkQuarto,
    1000
);

</script>

</body>
