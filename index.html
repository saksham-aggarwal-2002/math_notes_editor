<!DOCTYPE html>
<html>
<head>
<title>Math_Notes_Editor</title>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.js"></script>

<!-- CodeMirror folding -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.js"></script>

<style>
body{
    margin:0;
    font-family:sans-serif;
    height:100vh;
    overflow:hidden;
}

#toolbar{
    height:40px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    padding:0 10px;
    box-sizing:border-box;
    border-bottom:1px solid #ddd;
    gap:4px;
}

#app{
    display:flex;
    height:calc(100vh - 40px);
}

.toggle{
    padding:5px 13px;
    border:1px solid transparent;
    border-radius:5px;
    background:transparent;
    color:#666;
    cursor:pointer;
    font-size:14px;
    transition:
        background 0.15s ease,
        color 0.15s ease,
        box-shadow 0.15s ease;
}

.toggle:hover{
    background:#f3f3f3;
    color:#333;
}

.toggle.active{
    background:#e8e8e8;
    color:#111;
    border-color:#d2d2d2;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    font-weight:500;
}

#notes-view{
    display:flex;
    width:100%;
    height:100%;
}

#python-view{
    display:none;
    width:100%;
    height:100%;
}

#editor-panel{
    width:50%;
    height:100%;
    display:flex;
    flex-direction:column;
    border-right:1px solid #ddd
}

#editor-header{
    padding:12px 16px;
    border-bottom:1px solid #ddd;
    font-weight:bold
}

#editor{
    flex:1
}

.CodeMirror{
    height:100%;
    font-family:monospace;
    font-size:15px
}

.CodeMirror-foldgutter{
    width:16px
}

.CodeMirror-foldgutter-open,
.CodeMirror-foldgutter-folded{
    cursor:pointer
}

#quarto-panel{
    width:50%;
    height:100%
}

#quarto-frame{
    width:100%;
    height:100%;
    border:none
}

#jupyter-frame{
    width:100%;
    height:100%;
    border:none
}

#ai-prompt{
    position:fixed;
    top:30%;
    left:50%;
    transform:translate(-50%,-50%);
    width:500px;
    background:white;
    border:1px solid #ccc;
    border-radius:6px;
    padding:20px;
    box-shadow:0 5px 30px rgba(0,0,0,.2);
    display:none;
    z-index:1000
}

#ai-request{
    width:100%;
    box-sizing:border-box;
    padding:10px;
    font-family:sans-serif;
    font-size:16px;
    resize:vertical
}

#reference-fields{
    display:none;
}

.reference-row{
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

.reference-row label{
    width:70px;
    font-family:monospace;
    font-size:16px;
}

.reference-row input{
    flex:1;
    box-sizing:border-box;
    padding:10px;
    font-family:monospace;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:4px;
}

.tag-input{
    flex:1;
    display:flex;
    align-items:center;
    border:1px solid #ccc;
    border-radius:4px;
    overflow:hidden;
}

.tag-input span{
    padding-left:10px;
    font-family:monospace;
    font-size:16px;
    color:#777;
}

.tag-input input{
    border:none;
    outline:none;
    padding:10px;
    width:100%;
}

#image-picker{
    position:fixed;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    width:600px;
    max-height:60vh;
    background:white;
    border:1px solid #ccc;
    border-radius:6px;
    box-shadow:0 5px 30px rgba(0,0,0,.2);
    display:none;
    z-index:1000;
    overflow:hidden;
}

#image-search{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border:none;
    border-bottom:1px solid #ddd;
    outline:none;
    font-family:sans-serif;
    font-size:16px;
}

#image-list{
    max-height:calc(60vh - 50px);
    overflow-y:auto;
}

.image-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.image-item:hover,
.image-item.selected{
    background:#f0f0f0;
}

.image-thumbnail{
    width:70px;
    height:50px;
    object-fit:contain;
    border:1px solid #ddd;
    background:white;
}

.image-name{
    font-family:monospace;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

</style>

</head>

<body>

<div id="toolbar">
    <button class="toggle active" id="notes-button">Notes</button>
    <button class="toggle" id="python-button">Python</button>
</div>

<div id="app">

<div id="notes-view">

<div id="editor-panel">

    <div id="editor-header">
        Loading subject...
    </div>

    <textarea id="editor"></textarea>

</div>

<div id="quarto-panel">
    <iframe id="quarto-frame"></iframe>
</div>

</div>

<div id="python-view">
    <iframe id="jupyter-frame"></iframe>
</div>

</div>

<div id="ai-prompt">

    <div id="ai-prompt-content">

        <textarea
            id="ai-request"
            rows="4"
            placeholder="What should I insert?"
        ></textarea>

        <div id="reference-fields">

            <div class="reference-row">
                <label for="reference-heading">heading:</label>
                <input
                    id="reference-heading"
                    type="text"
                    autocomplete="off"
                >
            </div>

            <div class="reference-row">
                <label for="reference-tag">tag:</label>
                <div class="tag-input">
                    <span>#</span>
                    <input
                        id="reference-tag"
                        type="text"
                        autocomplete="off"
                    >
                </div>
            </div>

        </div>

    </div>

</div>

<div id="image-picker">

    <input
        id="image-search"
        type="text"
        placeholder="Search images..."
        autocomplete="off"
    >

    <div id="image-list"></div>

</div>

<script>

let editor;
let saveTimer=null;
let lastQuartoModified=null;
let subjectConfig=null;


/* --------------------------------------------------
   Initial Quarto preview
-------------------------------------------------- */

async function loadSubjectConfig(){

    const response=await fetch("/subject-config");
    subjectConfig=await response.json();

    document.getElementById("editor-header").textContent=
        subjectConfig.qmd;

    document.getElementById("quarto-frame").src=
        "/notes/" + encodeURIComponent(subjectConfig.html) + "?t=" + Date.now();

    document.getElementById("jupyter-frame").src=
        "http://127.0.0.1:8890/lab/tree/" +
        encodeURIComponent(subjectConfig.notebook);
}


/* --------------------------------------------------
   Custom Quarto folding
-------------------------------------------------- */

CodeMirror.registerHelper("fold","quarto",function(cm,start){

    const line=start.line;
    const text=cm.getLine(line);

    if(/^\s*:::\s*/.test(text)){

        for(let i=line+1;i<cm.lineCount();i++){

            if(/^\s*:::\s*$/.test(cm.getLine(i))){

                return {
                    from:CodeMirror.Pos(line,text.length),
                    to:CodeMirror.Pos(
                        i,
                        cm.getLine(i).length
                    )
                };

            }

        }

        return;
    }

    if(/^\s*#{1,6}\s+/.test(text)){

        const match=text.match(/^\s*(#{1,6})\s+/);
        const headingLevel=match[1].length;

        for(let i=line+1;i<cm.lineCount();i++){

            const nextLine=cm.getLine(i);

            const nextMatch=
                nextLine.match(/^\s*(#{1,6})\s+/);

            if(
                nextMatch &&
                nextMatch[1].length<=headingLevel
            ){

                return {
                    from:CodeMirror.Pos(line,text.length),
                    to:CodeMirror.Pos(
                        i-1,
                        cm.getLine(i-1).length
                    )
                };

            }

        }

        return {
            from:CodeMirror.Pos(line,text.length),
            to:CodeMirror.Pos(
                cm.lineCount()-1,
                cm.getLine(cm.lineCount()-1).length
            )
        };

    }

});


/* --------------------------------------------------
   Load notebook
-------------------------------------------------- */

async function loadNotebook(){

    const response=await fetch("/notebook");
    const data=await response.json();

    editor=CodeMirror.fromTextArea(
        document.getElementById("editor"),
        {

            mode:"markdown",

            lineNumbers:true,

            lineWrapping:true,

            foldGutter:{
                rangeFinder:function(cm,start){

                    return CodeMirror.fold.quarto(
                        cm,
                        start
                    );

                }
            },

            gutters:[
                "CodeMirror-linenumbers",
                "CodeMirror-foldgutter"
            ]

        }
    );

    editor.setValue(data.content);

    for(let i=0;i<editor.lineCount();i++){

        if(/^#\s+/.test(editor.getLine(i))){

            editor.foldCode(CodeMirror.Pos(i,0));

        }

    }

    editor.on("change",saveNotebook);

}


/* --------------------------------------------------
   Save notebook
-------------------------------------------------- */

function saveNotebook(){

    clearTimeout(saveTimer);

    saveTimer=setTimeout(async()=>{

        await fetch("/notebook",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                content:editor.getValue()
            })

        });

    },500);

}


loadSubjectConfig();
loadNotebook();


/* --------------------------------------------------
   AI shortcut
-------------------------------------------------- */

document.addEventListener("keydown",event=>{

    if(
        event.metaKey &&
        event.shiftKey &&
        event.key.toLowerCase()==="l"
    ){

        event.preventDefault();

        if(
            document.getElementById("python-view")
            .style.display==="block"
        ){

            openPythonAIPrompt();

        }else{

            openAIPrompt();

        }

    }


    if(
        event.metaKey &&
        event.shiftKey &&
        event.key.toLowerCase()==="p"
    ){

        event.preventDefault();
        insertPlaceholder();

    }


    if(
        event.metaKey &&
        event.shiftKey &&
        event.key.toLowerCase()==="o"
    ){

        event.preventDefault();
        addExampleReference();

    }


    if(
        event.metaKey &&
        event.shiftKey &&
        event.key.toLowerCase()==="i"
    ){

        event.preventDefault();
        openImagePicker();

    }

});


/* --------------------------------------------------
   Python AI prompt
-------------------------------------------------- */

function openPythonAIPrompt(requestId){

    const prompt =
        document.getElementById("ai-prompt");

    const input =
        document.getElementById("ai-request");

    prompt.style.display="block";

    input.value="";

    input.placeholder=
        "What Python code should I insert?";

    prompt.dataset.pythonRequestId =
        requestId || crypto.randomUUID();

    input.focus();

}


/* --------------------------------------------------
   Messages from JupyterLab
-------------------------------------------------- */

window.addEventListener("message",event=>{

    if(
        event.origin!=="http://127.0.0.1:8890"
    ){

        return;

    }


    if(
        !event.data ||
        event.data.type!=="math_notes_editor-open-python-prompt"
    ){

        return;

    }


    openPythonAIPrompt(
        event.data.requestId
    );

});


/* --------------------------------------------------
   Commands to JupyterLab
-------------------------------------------------- */

function postToJupyter(message){

    const frame =
        document.getElementById(
            "jupyter-frame"
        );

    frame.contentWindow.postMessage(
        message,
        "http://127.0.0.1:8890"
    );

}


function createPlaceholderInJupyter(
    requestId
){

    postToJupyter({
        type:
            "math_notes_editor-create-placeholder",

        requestId:
            requestId
    });

}


function insertTextIntoJupyter(
    text,
    requestId
){

    postToJupyter({
        type:
            "math_notes_editor-insert-text",

        text:
            text,

        requestId:
            requestId
    });

}


/* --------------------------------------------------
   Insert Python text
-------------------------------------------------- */

async function insertPythonText(){

    const input =
        document.getElementById("ai-request");

    const request =
        input.value.trim();

    if(!request){

        return;

    }


    const prompt =
        document.getElementById("ai-prompt");

    const requestId =
        prompt.dataset.pythonRequestId;


    if(!requestId){

        alert(
            "Could not identify the notebook cell."
        );

        return;

    }


    closeAIPrompt();

    createPlaceholderInJupyter(
        requestId
    );


    try{

        const response =
            await fetch(
                "/ai/generate-python",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:request
                    })

                }
            );


        if(!response.ok){

            throw new Error(
                "AI request failed."
            );

        }


        const data =
            await response.json();


        if(
            !data.content
        ){

            throw new Error(
                "AI returned no content."
            );

        }


        insertTextIntoJupyter(
            data.content,
            requestId
        );


    }catch(error){

        console.error(
            "Python AI generation failed:",
            error
        );

        alert(
            "AI generation failed."
        );

    }

}


/* --------------------------------------------------
   Example reference
-------------------------------------------------- */
function insertPlaceholder(){

    const placeholder=`::: {.box}

[content describing the placeholder]{style="color: red;"}.

:::` + "\n";

    const cursor=editor.getCursor();

    editor.replaceRange(
        placeholder,
        cursor
    );

    editor.setCursor({
        line:cursor.line+2,
        ch:1
    });

    editor.focus();

}

function addExampleReference(){

    const prompt=document.getElementById("ai-prompt");
    const aiRequest=document.getElementById("ai-request");
    const referenceFields=document.getElementById("reference-fields");

    aiRequest.style.display="none";
    referenceFields.style.display="block";

    prompt.style.display="block";

    const heading=document.getElementById("reference-heading");
    const tag=document.getElementById("reference-tag");

    heading.value="";
    tag.value="";

    heading.focus();


    function submitReference(){

        const headingText=heading.value.trim();
        const tagText=tag.value.trim();

        if(!headingText || !tagText){

            return;

        }

        const link=`See [${headingText}](#${tagText})`;

        const cursor=editor.getCursor();

        editor.replaceRange(
            link,
            cursor
        );

        const lastLine=editor.lineCount()-1;

        editor.replaceRange(
            `\n\n### ${headingText}  {#${tagText}}\n`,
            CodeMirror.Pos(
                lastLine,
                editor.getLine(lastLine).length
            )
        );

        closeReferencePrompt();

        editor.focus();

    }


    function handleKey(event){

        if(event.key==="Enter"){

            event.preventDefault();
            submitReference();

        }

        if(event.key==="Escape"){

            event.preventDefault();
            closeReferencePrompt();

        }

    }


    heading.onkeydown=handleKey;
    tag.onkeydown=handleKey;

}


function closeReferencePrompt(){

    document.getElementById("ai-prompt").style.display="none";

    document.getElementById("reference-fields").style.display="none";

    document.getElementById("ai-request").style.display="block";

}


/* --------------------------------------------------
   AI prompt
-------------------------------------------------- */

function openAIPrompt(){

    const prompt =
        document.getElementById("ai-prompt");

    const input =
        document.getElementById("ai-request");

    prompt.style.display="block";

    input.value="";

    input.placeholder=
        "What should I insert?";

    input.focus();

}


function closeAIPrompt(){

    document.getElementById("ai-prompt").style.display="none";

    document.getElementById("reference-fields").style.display="none";

    document.getElementById("ai-request").style.display="block";

}


document.getElementById("ai-request")
.addEventListener("keydown",event=>{

    if(
        event.key==="Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        const pythonView =
            document.getElementById("python-view");

        if(pythonView.style.display==="block"){

            insertPythonText();

        }else{

            generateAtCursor();

        }

    }


    if(event.key==="Escape"){

        closeAIPrompt();

    }

});


/* --------------------------------------------------
   AI generation
-------------------------------------------------- */

async function generateAtCursor(){

    const request=
        document.getElementById("ai-request")
        .value.trim();

    if(!request)return;

    const marker="<!-- AI_GENERATING -->";

    const cursor=editor.getCursor();

    editor.replaceRange(
        marker,
        cursor
    );

    closeAIPrompt();

    editor.focus();


    try{

        const response=await fetch(
            "/ai/generate",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    message:request
                })

            }
        );


        if(!response.ok){

            throw new Error(
                "AI request failed."
            );

        }


        const data=await response.json();

        const text=editor.getValue();

        const markerIndex=
            text.indexOf(marker);


        if(markerIndex===-1){

            alert(
                "Could not find the AI insertion point."
            );

            return;

        }


        const from=
            editor.posFromIndex(markerIndex);


        const to=
            editor.posFromIndex(
                markerIndex+marker.length
            );


        editor.replaceRange(
            data.content,
            from,
            to
        );


    }catch(error){

        alert("AI generation failed.");

    }

}


/* --------------------------------------------------
   Quarto preview refresh
-------------------------------------------------- */

async function checkQuarto(){

    if(!subjectConfig){

        return;

    }

    try{

        const response=
            await fetch("/quarto-version");

        const data=
            await response.json();


        if(lastQuartoModified===null){

            lastQuartoModified=
                data.modified;

            return;

        }


        if(
            data.modified !==
            lastQuartoModified
        ){

            lastQuartoModified=
                data.modified;


            const frame=
                document.getElementById(
                    "quarto-frame"
                );


            let scrollX=0;
            let scrollY=0;


            try{

                scrollX=
                    frame.contentWindow.scrollX;

                scrollY=
                    frame.contentWindow.scrollY;

            }catch(error){

                console.log(
                    "Could not read preview scroll position."
                );

            }


            frame.src=
                "/notes/" + encodeURIComponent(subjectConfig.html) + "?t=" + Date.now();


            frame.onload=()=>{

                try{

                    frame.contentWindow.scrollTo(
                        scrollX,
                        scrollY
                    );

                }catch(error){

                    console.log(
                        "Could not restore preview scroll position."
                    );

                }

            };

        }


    }catch(error){

        console.log(
            "Could not check Quarto status."
        );

    }

}


setInterval(
    checkQuarto,
    1000
);


/* --------------------------------------------------
   Notes / Python toggle
-------------------------------------------------- */

document.getElementById("notes-button").onclick=showNotes;
document.getElementById("python-button").onclick=showPython;

function showNotes(){

    document.getElementById("notes-view").style.display="flex";
    document.getElementById("python-view").style.display="none";

    document.getElementById("notes-button").classList.add("active");
    document.getElementById("python-button").classList.remove("active");

    editor.refresh();

}

function showPython(){

    document.getElementById("notes-view").style.display="none";
    document.getElementById("python-view").style.display="block";

    document.getElementById("notes-button").classList.remove("active");
    document.getElementById("python-button").classList.add("active");

}


/* --------------------------------------------------
   Image picker
-------------------------------------------------- */

let availableImages = [];
let filteredImages = [];
let selectedImageIndex = 0;


/* --------------------------------------------------
   Open image picker
-------------------------------------------------- */

async function openImagePicker(){

    const picker =
        document.getElementById("image-picker");

    const search =
        document.getElementById("image-search");

    picker.style.display="block";

    search.value="";

    selectedImageIndex=0;

    try{

        const response =
            await fetch("/images");

        if(!response.ok){

            throw new Error(
                "Could not load images."
            );

        }

        availableImages =
            await response.json();

        filteredImages =
            [...availableImages];

        renderImageList();

        search.focus();

    }catch(error){

        alert("Could not load images.");

        closeImagePicker();

    }

}


/* --------------------------------------------------
   Render image list
-------------------------------------------------- */

function renderImageList(){

    const list =
        document.getElementById("image-list");

    list.innerHTML="";

    if(filteredImages.length===0){

        const empty =
            document.createElement("div");

        empty.style.padding="20px";
        empty.style.color="#777";

        empty.textContent="No images found.";

        list.appendChild(empty);

        return;

    }


    filteredImages.forEach((image,index)=>{

        const item =
            document.createElement("div");

        item.className="image-item";

        if(index===selectedImageIndex){

            item.classList.add("selected");

        }


        const thumbnail =
            document.createElement("img");

        thumbnail.className="image-thumbnail";

        thumbnail.src=
            "/subject-images/" +
            encodeURIComponent(image.name);


        const name =
            document.createElement("div");

        name.className="image-name";

        name.textContent=image.name;


        item.appendChild(thumbnail);
        item.appendChild(name);


        item.onclick=()=>{

            insertImage(image);

        };


        list.appendChild(item);

    });

}


/* --------------------------------------------------
   Insert image
-------------------------------------------------- */

function insertImage(image){

    const cursor =
        editor.getCursor();

    const markdown =
    `::: {.text-center}\n` +
    `![](images/${image.name})\n` +
    `:::\n`;

    editor.replaceRange(
        markdown,
        cursor
    );

    closeImagePicker();

    editor.focus();

}


/* --------------------------------------------------
   Close image picker
-------------------------------------------------- */

function closeImagePicker(){

    document.getElementById(
        "image-picker"
    ).style.display="none";

}


/* --------------------------------------------------
   Search images
-------------------------------------------------- */

document.getElementById("image-search")
.addEventListener("input",event=>{

    const query =
        event.target.value
            .toLowerCase()
            .trim();

    filteredImages =
        availableImages.filter(image =>
            image.name
                .toLowerCase()
                .includes(query)
        );

    selectedImageIndex=0;

    renderImageList();

});


/* --------------------------------------------------
   Image picker keyboard controls
-------------------------------------------------- */

document.getElementById("image-search")
.addEventListener("keydown",event=>{

    if(event.key==="Escape"){

        event.preventDefault();

        closeImagePicker();

        editor.focus();

        return;

    }


    if(event.key==="ArrowDown"){

        event.preventDefault();

        if(filteredImages.length===0)return;

        selectedImageIndex =
            Math.min(
                selectedImageIndex+1,
                filteredImages.length-1
            );

        renderImageList();

        scrollSelectedImageIntoView();

        return;

    }


    if(event.key==="ArrowUp"){

        event.preventDefault();

        if(filteredImages.length===0)return;

        selectedImageIndex =
            Math.max(
                selectedImageIndex-1,
                0
            );

        renderImageList();

        scrollSelectedImageIntoView();

        return;

    }


    if(event.key==="Enter"){

        event.preventDefault();

        if(filteredImages.length===0)return;

        insertImage(
            filteredImages[selectedImageIndex]
        );

    }

});


function scrollSelectedImageIntoView(){
