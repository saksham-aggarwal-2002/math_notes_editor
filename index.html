<!DOCTYPE html>

<html>
<head>
<title>My Learning AI</title>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.js"></script>

<style>
body{margin:0;font-family:sans-serif;height:100vh;overflow:hidden}
#toolbar{height:45px;display:flex;align-items:center;border-bottom:1px solid #ddd;padding:0 12px;box-sizing:border-box}
.toggle{padding:6px 12px;border:1px solid #ccc;background:white;cursor:pointer}
.toggle.active{background:#eee}
#app{height:calc(100vh - 45px)}
#notes-view{display:flex;height:100%}
#editor-panel{width:50%;height:100%;display:flex;flex-direction:column;border-right:1px solid #ddd}
#editor-header{padding:12px 16px;border-bottom:1px solid #ddd;font-weight:bold}
#editor{flex:1}
.CodeMirror{height:100%;font-family:monospace;font-size:15px}
#quarto-panel{width:50%;height:100%}
#quarto-frame{width:100%;height:100%;border:none}
#python-view{width:100%;height:100%;display:none}
#jupyter-frame{width:100%;height:100%;border:none}
#ai-prompt{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);width:500px;background:white;border:1px solid #ccc;border-radius:6px;padding:20px;box-shadow:0 5px 30px rgba(0,0,0,.2);display:none;z-index:1000}
#ai-request{width:100%;box-sizing:border-box;padding:10px;font-family:sans-serif;font-size:16px;resize:vertical}
</style>

</head>

<body>

<div id="toolbar">
    <button class="toggle active" id="notes-button">Notes</button>
    <button class="toggle" id="python-button">Python</button>
</div>

<div id="app">


<div id="notes-view">
    <div id="editor-panel">
        <div id="editor-header">linalg_1.qmd</div>
        <textarea id="editor"></textarea>
    </div>

    <div id="quarto-panel">
        <iframe id="quarto-frame"></iframe>
    </div>
</div>

<div id="python-view">
    <iframe id="jupyter-frame" src="http://127.0.0.1:8890/lab"></iframe>
</div>

</div>

<div id="ai-prompt">
    <textarea id="ai-request" rows="4" placeholder="What should I insert?"></textarea>
</div>

<script>
let editor;
let saveTimer=null;
let lastQuartoModified=null;

document.getElementById("quarto-frame").src="/notes/linalg_1.html?t="+Date.now();

async function loadNotebook(){
    const response=await fetch("/notebook");
    const data=await response.json();

    editor=CodeMirror.fromTextArea(
        document.getElementById("editor"),
        {mode:"markdown",lineNumbers:true,lineWrapping:true}
    );

    editor.setValue(data.content);
    editor.on("change",saveNotebook);
}

function saveNotebook(){
    clearTimeout(saveTimer);

    saveTimer=setTimeout(async()=>{
        await fetch("/notebook",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({content:editor.getValue()})
        });
    },500);
}

loadNotebook();

document.addEventListener("keydown",event=>{
    if(event.metaKey&&event.shiftKey&&event.key.toLowerCase()==="l"){
        event.preventDefault();

        if(document.getElementById("notes-view").style.display!=="none"){
            openAIPrompt();
        }
    }
});

function openAIPrompt(){
    const prompt=document.getElementById("ai-prompt");
    prompt.style.display="block";

    const input=document.getElementById("ai-request");
    input.value="";
    input.focus();
}

function closeAIPrompt(){
    document.getElementById("ai-prompt").style.display="none";
}

document.getElementById("ai-request").addEventListener("keydown",event=>{
    if(event.key==="Enter"&&!event.shiftKey){
        event.preventDefault();
        generateAtCursor();
    }

    if(event.key==="Escape"){
        closeAIPrompt();
    }
});

async function generateAtCursor(){
    const request=document.getElementById("ai-request").value.trim();
    if(!request)return;

    const marker="<!-- AI_GENERATING -->";
    const cursor=editor.getCursor();

    editor.replaceRange(marker,cursor);
    closeAIPrompt();
    editor.focus();

    try{
        const response=await fetch("/ai/generate",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:request})
        });

        if(!response.ok)throw new Error("AI request failed.");

        const data=await response.json();

        const text=editor.getValue();
        const markerIndex=text.indexOf(marker);

        if(markerIndex===-1){
            alert("Could not find the AI insertion point.");
            return;
        }

        const from=editor.posFromIndex(markerIndex);
        const to=editor.posFromIndex(markerIndex+marker.length);

        editor.replaceRange(data.content,from,to);

    }catch(error){
        alert("AI generation failed.");
    }
}

async function checkQuarto(){
    try{
        const response=await fetch("/quarto-version");
        const data=await response.json();

        if(lastQuartoModified===null){
            lastQuartoModified=data.modified;
            return;
        }

        if(data.modified!==lastQuartoModified){
            lastQuartoModified=data.modified;

            const frame=document.getElementById("quarto-frame");

            let scrollX=0;
            let scrollY=0;

            try{
                scrollX=frame.contentWindow.scrollX;
                scrollY=frame.contentWindow.scrollY;
            }catch(error){}

            frame.src="/notes/linalg_1.html?t="+Date.now();

            frame.onload=()=>{
                try{
                    frame.contentWindow.scrollTo(scrollX,scrollY);
                }catch(error){}
            };
        }
    }catch(error){}
}

setInterval(checkQuarto,1000);

function showNotes(){
    document.getElementById("notes-view").style.display="flex";
    document.getElementById("python-view").style.display="none";

    document.getElementById("notes-button").classList.add("active");
    document.getElementById("python-button").classList.remove("active");

    editor.refresh();
}

function showPython(){
    document.getElementById("notes-view").style.display="none";
    document.getElementById("python-view").style.display="block";

    document.getElementById("notes-button").classList.remove("active");
    document.getElementById("python-button").classList.add("active");
}

document.getElementById("notes-button").addEventListener("click",showNotes);
document.getElementById("python-button").addEventListener("click",showPython);

</script>

</body>
</html>
