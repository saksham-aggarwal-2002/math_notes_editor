[build-system]
requires = [
    "hatchling>=1.5.0",
    "hatch-jupyter-builder>=0.5"
]
build-backend = "hatchling.build"

[project]
name = "math_notes_editor-jupyter-bridge"
version = "0.1.0"
description = "Bridge between math_notes_editor and JupyterLab"
requires-python = ">=3.9"

[tool.hatch.build.targets.wheel]
packages = ["math_notes_editor_jupyter_bridge"]

[tool.hatch.build.targets.wheel.shared-data]
"math_notes_editor_jupyter_bridge/labextension" = "share/jupyter/labextensions/math_notes_editor-jupyter-bridge"

[tool.hatch.build.targets.sdist]
artifacts = [
    "math_notes_editor_jupyter_bridge/labextension"
]

[tool.hatch.build.hooks.jupyter-builder]
dependencies = [
    "hatch-jupyter-builder>=0.5"
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build"

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "build"